<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marshmallow Challenge Web App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1>マシュマロチャレンジ進行アプリ</h1>
        <p>最小構成版</p>
      </header>

      <main>
        <section id="home" class="panel active">
          <h2>開始画面</h2>
          <p>チームを作成して、制限時間と進行フローを始めます。</p>
          <button id="startBtn">開始する</button>
        </section>

        <section id="setup" class="panel">
          <h2>設定</h2>
          <div class="form-grid">
            <label>
              制限時間(秒)
              <input id="roundSeconds" type="number" min="30" step="10" value="180" />
            </label>
            <label>
              ラウンド数
              <input id="roundCount" type="number" min="1" max="5" value="3" />
            </label>
          </div>
          <label>
            チーム名（1行ごとに1チーム）
            <textarea id="teamNames" rows="8">チームA
チームB
チームC</textarea>
          </label>
          <div class="actions">
            <button id="saveSetupBtn">設定を保存</button>
          </div>
        </section>

        <section id="progress" class="panel">
          <h2>進行中</h2>
          <div class="status-row">
            <div>
              <span class="label">現在のラウンド</span>
              <strong id="currentRound">1 / 3</strong>
            </div>
            <div>
              <span class="label">現在のチーム</span>
              <strong id="currentTeam">チームA</strong>
            </div>
          </div>

          <div class="timer-card">
            <div id="timerDisplay">03:00</div>
            <div class="timer-actions">
              <button id="timerToggleBtn">開始</button>
              <button id="nextRoundBtn">次のラウンド</button>
            </div>
          </div>

          <div class="team-list-wrap">
            <h3>チーム一覧</h3>
            <div id="teamList" class="team-list"></div>
          </div>

          <div class="actions">
            <button id="toReviewBtn">評価画面へ</button>
          </div>
        </section>

        <section id="review" class="panel">
          <h2>評価</h2>
          <div id="reviewCards" class="review-grid"></div>
          <div class="actions">
            <button id="toResultBtn">結果表示</button>
          </div>
        </section>

        <section id="result" class="panel">
          <h2>結果</h2>
          <div id="resultList" class="result-list"></div>
          <div class="actions">
            <button id="resetBtn">最初からやり直す</button>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
